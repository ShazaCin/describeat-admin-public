name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create aws-exports stub
        run: cp src/aws-exports.example.ts src/aws-exports.ts

      # Not enforced yet: the repo has no ESLint configuration file (eslint.config.*), so lint cannot run.
      - name: Lint
        continue-on-error: true
        run: npm run lint --if-present

      - name: Test
        run: npm run test:run -- --passWithNoTests

      # The build runs `tsc -b` first, so it is also the strict type check.
      - name: Build
        run: npm run build

  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}